<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamplo WASM Test Console</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            text-align: center;
        }

        #loading h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>🎮 Loading Gamplo WASM Console...</h1>
        <div class="spinner"></div>
    </div>
    <canvas id="the_canvas_id"></canvas>
    <script type="module">
        import init, { start } from './pkg/gamplo_wasm.js';

        async function run() {
            try {
                await init();
                await start(document.getElementById("the_canvas_id"));
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Failed to start application:', error);
                document.getElementById('loading').innerHTML = `
                    <h1>❌ Error Loading Application</h1>
                    <p style="margin-top: 20px; color: #ff6b6b;">${error.message}</p>
                `;
            }
        }

        run();
    </script>
</body>
</html>
